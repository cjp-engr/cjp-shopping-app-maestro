appId: ${APP_ID}
# Buyer login subflow — uses BUYER_EMAIL and BUYER_PASSWORD env vars.
# Add these to your .env file:
#   BUYER_EMAIL=b1@test.com
#   BUYER_PASSWORD=yourpassword
---

- runFlow: ../../elements/loadElements.yaml
- launchApp:
    clearState: true

# Dismiss the push-permission prompt only if it appears
- runFlow:
    when:
      visible: 'Allow notifications?'
    commands:
      - tapOn: 'Allow'

- tapOn:
    id: ${output.login.loginEmailField}
- inputText: ${BUYER_EMAIL}
- tapOn:
    id: ${output.login.loginPasswordField}
- inputText: ${PASSWORD}

- hideKeyboard

- tapOn:
    id: ${output.login.loginButton}
- assertVisible: "New Arrivals"
